<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medium+ | Role Selection</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>


<link href="tailwind.css?v=3" rel="stylesheet"/><link href="custom.css" rel="stylesheet"/></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopNavBar -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0px_4px_15px_0px_rgba(0,0,0,0.05)] dark:shadow-none sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">
<div class="text-title-lg font-title-lg font-bold text-primary dark:text-primary-fixed-dim"><img src="./logo.jpeg" alt="Medium+" style="height: 32px; display: inline-block;" /></div>
<div class="flex items-center gap-md">
<button class="hidden md:block text-on-secondary-fixed-variant hover:text-primary transition-colors duration-200 text-label-sm font-label-sm">Help</button>
<span class="material-symbols-outlined text-on-secondary-fixed-variant" data-icon="account_circle">account_circle</span>
</div>
</div>
</nav>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-2xl">
<div class="w-full max-w-[720px]">
<!-- Progress Bar Section -->
<div class="mb-xl">
<div class="flex justify-between items-end mb-sm">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider">Step 1 of 5</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Role Selection</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[20%] rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Selection Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_15px_0px_rgba(0,0,0,0.05)] p-lg md:p-xl text-center border border-outline-variant/30">
<h1 class="font-headline-md text-headline-md md:text-headline-lg mb-md text-on-surface">How will you be using Medium+?</h1>
<p class="text-body-md font-body-md text-on-surface-variant mb-2xl max-w-md mx-auto">Select the primary way you'll interact with our clinical ecosystem to personalize your experience.</p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-2xl">
<!-- Provider Option -->
<button class="group flex flex-col items-center p-xl rounded-xl border-2 border-surface-container-high bg-surface-container-low hover:border-primary/50 hover:bg-primary-container/5 transition-all duration-200 text-left cursor-pointer" id="role-provider" onclick="selectRole('provider')">
<div class="icon-container w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-primary mb-md transition-colors duration-200">
<span class="material-symbols-outlined text-[32px]" data-icon="medical_services">medical_services</span>
</div>
<h3 class="font-title-md text-title-md mb-xs text-on-surface">I am a Doctor</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant text-center">Register as a licensed healthcare professional.</p>
</button>
<!-- Patient Option -->
<button class="group flex flex-col items-center p-xl rounded-xl border-2 border-surface-container-high bg-surface-container-low hover:border-primary/50 hover:bg-primary-container/5 transition-all duration-200 text-left cursor-pointer" id="role-patient" onclick="selectRole('patient')">
<div class="icon-container w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-primary mb-md transition-colors duration-200">
<span class="material-symbols-outlined text-[32px]" data-icon="person">person</span>
</div>
<h3 class="font-title-md text-title-md mb-xs text-on-surface">I am a Patient</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant text-center">Manage appointments, health records, and billing.</p>
</button>
<!-- Hospital Option -->
<button class="group flex flex-col items-center p-xl rounded-xl border-2 border-surface-container-high bg-surface-container-low hover:border-primary/50 hover:bg-primary-container/5 transition-all duration-200 text-left cursor-pointer" id="role-hospital" onclick="selectRole('hospital')">
<div class="icon-container w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-primary mb-md transition-colors duration-200">
<span class="material-symbols-outlined text-[32px]">local_hospital</span>
</div>
<h3 class="font-title-md text-title-md mb-xs text-on-surface">I am a Hospital</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant text-center">Register your clinic or facility on Medium+.</p>
</button>
</div>
<div class="flex flex-col md:flex-row items-center justify-between gap-md">
<button class="w-full md:w-auto px-xl py-md text-label-md font-label-md text-on-secondary-fixed-variant hover:text-primary transition-colors flex items-center justify-center gap-xs" onclick="history.back()">
<span class="material-symbols-outlined text-md" data-icon="arrow_back">arrow_back</span>
                        Back
                    </button>
<button class="w-full md:w-auto px-3xl py-md bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm opacity-50 cursor-not-allowed hover:bg-primary-container transition-all duration-200 flex items-center justify-center gap-xs" disabled="" id="continue-btn">
                        Continue
                        <span class="material-symbols-outlined text-md" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full px-margin-mobile md:px-margin-desktop py-lg flex flex-col md:flex-row justify-between items-center gap-md bg-background">
<div class="text-label-md font-label-md font-bold text-on-surface">Medium+ Clinical</div>
<div class="flex flex-wrap justify-center gap-md">
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Security Standards</a>
</div>
<div class="text-body-sm font-body-sm text-on-surface-variant">
            © 2026 Medium+ Clinical. All rights reserved.
        </div>
</footer>

<script>
let selectedRole = null;
function selectRole(role) {
    selectedRole = role;
    ['provider','patient','hospital'].forEach(r => {
        const el = document.getElementById('role-' + r);
        if (el) {
            el.classList.remove('border-primary','bg-primary-container/10','shadow-md');
            el.classList.add('border-surface-container-high','bg-surface-container-low');
            
            const icon = el.querySelector('.icon-container');
            icon.classList.remove('bg-primary','text-white');
            icon.classList.add('bg-surface-container-highest','text-primary');
        }
    });
    
    const btn = document.getElementById('role-' + role);
    if (btn) {
        btn.classList.remove('border-surface-container-high','bg-surface-container-low');
        btn.classList.add('border-primary','bg-primary-container/10','shadow-md');
        
        const icon = btn.querySelector('.icon-container');
        icon.classList.remove('bg-surface-container-highest','text-primary');
        icon.classList.add('bg-primary','text-white');
    }
    
    const cont = document.getElementById('continue-btn');
    cont.disabled = false;
    cont.classList.remove('opacity-50','cursor-not-allowed');
    cont.onclick = () => {
        if (role === 'patient') window.location.href = 'register_patient_onboarding.html';
        else if (role === 'provider') window.location.href = 'register_doctor_basic_info_step_1.html';
        else if (role === 'hospital') window.location.href = 'register_hospital.html';
    };
}
</script>
<div class="hidden border-primary bg-primary-container/10 shadow-md bg-primary text-white"></div>
</body></html>
